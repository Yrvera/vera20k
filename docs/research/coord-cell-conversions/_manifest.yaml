config:
  max_queue_depth: 15
  max_scope_multiplier: 2.0
  ts_legacy_threshold: 0.5
  max_bfs_depth: 2     # overridden from default 3; MapCoord_Set has too many callers for depth-3
  decoder_count: 3

description: |
  Decodes the foundational coord/cell conversion math layer of gamemd.exe — the
  primitives every system on top depends on. Covers the 5 reference frames named in
  CLAUDE.md's "Coordinate conventions" section (Location, Get_Cell_Packed,
  GetCoords, foundation outline, and dock/refinery reference points), plus the underlying
  CoordStruct (3D leptons, 12 bytes) and CellStruct (2D cell index, 4 bytes)
  primitives, plus the sign-correct arithmetic shift `(x + ((x >> 31) & 0xFF)) >> 8`
  that converts signed leptons to cell indices with correct floor semantics on
  negative coords.

  Deliberately OUT OF SCOPE (each its own future /decode-system):
    - Full BuildingClass dock/anchor/exit-cell state machine beyond the verified
      refinery accepted target / GetDockCoord arrival / QueueingCell split and
      the verified MissionEnter/0x16/PerCellProcess radio-timer handoff
      (foundation-anchor-system)
    - MapClass cell grid storage + iteration (map-cell-grid)
    - Render-side CoordsToClient / AdjustForZ / iso projection
      (already covered by COORDINATE_ATOMS_AUDIT.md and FUN_0047b3a0 is the
      iso matrix init seen as Get_Center_Coords callee — left as out-of-scope-ref)

anchors:
  - { kind: function, name: ObjectClass__Get_Cell_Packed, address: 0x0041bea0,
      role: "lepton->cell-index gate (vtable+0x1B8); applies sign-correct shift; verified via decompile_function 0x0041bea0" }
  - { kind: function, name: CellClass__Get_Center_Coords, address: 0x00480a30,
      role: "cell-index->lepton inverse (cell*256+128 sub-cell center); verified via decompile_function 0x00480a30" }
  - { kind: function, name: MapCoord_Set,                 address: 0x0042d470,
      role: "CellStruct 2-component setter (the primitive every cell-coord op uses); verified via decompile_function 0x0042d470" }

