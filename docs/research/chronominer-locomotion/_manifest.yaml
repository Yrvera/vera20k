# Notes for decoders / proofer / rust-comparer:
#
# - TeleportLocomotionClass implements three COM interfaces via three vtables
#   (set in Constructor): IUnknown (param_1[0]), ILocomotion (param_1[1]),
#   IPiggyback (param_1[6]). Verify via decompile_function 0x00718000.
#
# - The locomotor's state machine is a 7-state machine (0..7) keyed on offset
#   +0x34 of TeleportLocomotionClass (param_1[0xd] when param_1 is int*).
#   Plate comment at 0x007192f0 already summarizes; verify each transition.
#
# - Per memory [feedback_chrono_miner_no_arrival_shimmer]: WarpOut SHP plays
#   at depart cell only. Per [feedback_chrono_teleport_direction]: chrono
#   miner warps inbound only. The locomotor itself is direction-agnostic —
#   these behaviors must emerge from caller selection (mission state machine
#   in miner module), not from chrono-miner-specific branches in the locomotor.
#
# - InitiateWarp computes delay = distance/Rules->ChronoDistanceFactor (Rules+0xbf4)
#   when Rules->ChronoTrigger (Rules+0xbf8) is set, clamped to
#   Rules->ChronoMinimumDelay (Rules+0xbfc). The harvester-flag branch (when
#   TechnoType+0x6c4 -> 0xe0e set) forces being_warped_ticks=0 — the "instant
#   warp for chrono miner" rule. Verify offsets via Rules struct layout.
#
# - The Rust port at src/sim/movement/teleport_movement.rs collapses the
#   7-state machine into 2 phases (Relocate, ChronoDelay). Rust-comparer
#   must default to DRIFT and only downgrade to INTERNAL-ONLY with
#   positive concrete evidence of observable equivalence per HARD-GATE.

