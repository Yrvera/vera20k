team-lead-preflight-findings:
  - "InfantryClass IronCurtain = instakill via vtable slot 0x16c (TakeDamage) with RulesClass+0xfa8 damage. Not a deflect, not invulnerability. Real load-bearing parity finding."
  - "TechnoClass__StartFidget at 0x004deae4 is MISNAMED — its body is the IronCurtain super-weapon dispatch (detects deflect via TechnoTypeClass+0xd97, handles chrono warp detach, sets timestamps, calls TechnoClass__IronCurtain). Rename recommendation, no auto-rename."
  - "Ghidra MCP get_function_callers is flaky on vtable-dispatched functions (IsIronCurtainActive, InfantryClass__IronCurtain, BuildingClass__IronCurtain, StartFidget all returned 'no callers' even with known xrefs). Decoders MUST fall back to get_xrefs_to <addr> when get_function_callers returns null."
  - "Force Shield (Yuri's secondary super weapon) shares the IC code path — the is_force_shield param on TechnoClass__IronCurtain branches to set +0x1c4=1. Force Shield may need to be in scope (out-of-scope-refs will surface it via decoder if so)."
