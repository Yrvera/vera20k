system: skirmish-cell-ui
created: 2026-05-24T14:20:00Z
last-updated: 2026-05-24T14:20:00Z

description: >
  Per-player row "cells" of the offline Skirmish setup dialog (0x102).
  Covers the eight player slots' cell controls: edit (name, slot 0),
  picture-flag static, country/color/AI-type/team/start-position combos.
  Includes initial population, runtime command dispatch, per-row enable
  state machine, sentinel writes when a row is closed, owner-draw combo
  paint, STT tooltip wiring for each cell, and persistence to RA2MD.INI
  Slot%02d / Session.Players[N].

config:
  max_queue_depth: 15
  max_scope_multiplier: 2.0
  ts_legacy_threshold: 0.5
  max_bfs_depth: 3
  decoder_count: 3

anchors:
