      role: "Dialog 0x102 custom init (msg 0x497) — populates every per-row cell for slots 0-7" }
  - { kind: function, name: FUN_006acee0, address: 0x006acee0,
      role: "WM_COMMAND dispatcher — routes cell change notifications + Start validation" }
  - { kind: function, name: FUN_006adc20, address: 0x006adc20,
      role: "Per-row enable state machine — cascades enable/sentinel through sibling cells" }

scope:
  initial_size: 65
